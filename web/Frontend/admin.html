<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 | BROS</title>
  <script>
    (function () {
      try {
        if (localStorage.getItem("bros-theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playball&family=Black+Han+Sans&family=Gaegu:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body data-page="admin">
  <div class="app">
    <div class="overlay" id="overlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar__top">
        <button class="icon-btn sidebar__close" id="sidebarClose" aria-label="메뉴 닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <a href="./index.html" class="logo">
          <span class="logo__text">Bros</span>
        </a>
      </div>

      <nav class="sidebar__nav" id="sidebarNav"></nav>

      <div class="sidebar__footer">
        <div class="stitch" aria-hidden="true">
          <svg viewBox="0 0 160 160" fill="none">
            <path d="M0 40 C 60 40, 100 80, 160 80" stroke="#E7E3C9" stroke-width="26" stroke-linecap="round"/>
            <g stroke="#C9A227" stroke-width="2.5" stroke-linecap="round">
              <path d="M20 28 l10 10 M30 24 l10 10 M42 22 l10 10 M55 22 l10 10 M68 24 l10 10 M80 28 l10 10 M92 34 l10 10 M104 42 l10 10 M116 52 l10 10 M128 62 l10 10 M140 72 l10 8"/>
            </g>
          </svg>
        </div>
        <p class="sidebar__tagline">BASEBALL MAKES<br />US STRONGER</p>
        <div class="sidebar__brand">
          <span class="sidebar__brand-logo">BROS</span>
          <span class="sidebar__brand-sub">ONE TEAM, HIGHER TOGETHER</span>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar topbar--solid" id="topbar">
        <div class="topbar__left">
          <button class="icon-btn topbar__menu" id="menuToggle" aria-label="메뉴 열기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <a href="./index.html" class="logo logo--mobile">
            <span class="logo__text">Bros</span>
          </a>
        </div>
        <div class="topbar__title" id="topbarTitle">
          <span class="topbar__title-mark">B</span>
          <span class="topbar__title-text">관리자</span>
        </div>
        <div class="topbar__right">
          <button class="icon-btn icon-btn--ghost" id="themeToggle" type="button" aria-label="다크모드 전환"></button>
          <button class="login-btn" id="loginBtn" type="button">로그인</button>
        </div>
      </header>

      <main class="content">
        <div class="page-header">
          <p class="page-header__eyebrow">관리자 전용</p>
          <h1 class="page-header__title">관리자</h1>
          <p class="page-header__desc">가입 신청을 승인하고, 경기 하이라이트를 등록할 수 있어요.</p>
        </div>

        <!-- 위쪽 탭: 회원 승인 / 하이라이트 관리 (js/admin.js) -->
        <div class="report-tabs admin-tabs" id="adminTabs" role="tablist" aria-label="관리 메뉴">
          <button type="button" class="report-tab report-tab--active" data-panel="users">회원 승인</button>
          <button type="button" class="report-tab" data-panel="highlights">하이라이트 관리</button>
        </div>

        <!-- 회원 승인 -->
        <div id="usersPanel">
          <div class="page-card">
            <div class="admin-filter" id="adminFilter" role="tablist" aria-label="회원 상태">
              <button type="button" class="admin-filter__btn admin-filter__btn--active" data-status="PENDING">승인 대기</button>
              <button type="button" class="admin-filter__btn" data-status="APPROVED">승인됨</button>
              <button type="button" class="admin-filter__btn" data-status="REJECTED">거절됨</button>
              <button type="button" class="admin-filter__btn" data-status="">전체</button>
            </div>
            <!-- js/admin.js 가 회원 목록을 그림 -->
            <div class="record-list" id="adminUserList"></div>
          </div>
        </div>

        <!-- 하이라이트 관리 (js/admin-highlight.js). 하이라이트 페이지에는 가장 최근 날짜의 경기가 보임 -->
        <div id="highlightsPanel" hidden>
          <div class="page-card">
            <h2 class="page-card__title">경기 등록</h2>
            <form class="admin-form" id="gameForm">
              <label class="auth-field">
                <span>경기 날짜</span>
                <input type="date" name="gameDate" required />
              </label>
              <label class="auth-field">
                <span>상대 팀</span>
                <input type="text" name="opponent" maxlength="100" placeholder="예: 한빛 타이거즈" required />
              </label>
              <label class="auth-field">
                <span>점수</span>
                <input type="text" name="score" maxlength="50" placeholder="예: BROS 7 : 3" required />
              </label>
              <button type="submit" class="admin-form__submit">경기 추가</button>
            </form>
          </div>

          <div class="page-card">
            <h2 class="page-card__title">경기 목록</h2>
            <div class="record-list" id="adminGameList"></div>
          </div>

          <!-- 경기 목록에서 "장면 관리" 를 누르면 보임 -->
          <div class="page-card" id="clipCard" hidden>
            <h2 class="page-card__title" id="clipCardTitle">장면 관리</h2>
            <form class="admin-form" id="clipForm">
              <label class="auth-field">
                <span>분류</span>
                <select name="category" required>
                  <option value="batting">타격 장면</option>
                  <option value="defense">수비 플레이</option>
                  <option value="highlight">주요 플레이</option>
                </select>
              </label>
              <label class="auth-field">
                <span>포지션 (수비는 필수)</span>
                <select name="position">
                  <option value="">없음</option>
                  <option value="P">P 투수</option>
                  <option value="C">C 포수</option>
                  <option value="1B">1B 1루수</option>
                  <option value="2B">2B 2루수</option>
                  <option value="3B">3B 3루수</option>
                  <option value="SS">SS 유격수</option>
                  <option value="LF">LF 좌익수</option>
                  <option value="CF">CF 중견수</option>
                  <option value="RF">RF 우익수</option>
                </select>
              </label>
              <label class="auth-field">
                <span>장면 이름</span>
                <input type="text" name="actionLabel" maxlength="100" placeholder="예: 5회 솔로 홈런" required />
              </label>
              <label class="auth-field">
                <span>영상 시간</span>
                <input type="text" name="timestamp" placeholder="예: 00:34:02" pattern="\d{1,2}:\d{2}:\d{2}" required />
              </label>
              <label class="auth-field admin-form__wide">
                <span>영상 주소 (선택)</span>
                <input type="url" name="clipUrl" maxlength="500" placeholder="https://..." />
              </label>
              <button type="submit" class="admin-form__submit">장면 추가</button>
            </form>
            <div class="record-list admin-clip-list" id="adminClipList"></div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./js/types.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/render.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/shell.js"></script>
  <script src="./js/admin.js"></script>
  <script src="./js/admin-highlight.js"></script>
</body>
</html>
