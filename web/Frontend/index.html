<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BROS | AI 야구 분석</title>
  <script>
    // 다크모드 새로고침 시 깜빡임(FOUC) 방지: CSS/본문이 그려지기 전에 저장된 테마를 먼저 적용
    (function () {
      try {
        if (localStorage.getItem("bros-theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playball&family=Black+Han+Sans&family=Gaegu:wght@700&family=Nanum+Brush+Script&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="page-home">
  <div class="app">
    <div class="overlay" id="overlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar__top">
        <button class="icon-btn sidebar__close" id="sidebarClose" aria-label="메뉴 닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <div class="logo">
          <span class="logo__text">Bros</span>
        </div>
      </div>

      <nav class="sidebar__nav" id="sidebarNav"></nav>

      <div class="sidebar__footer">
        <div class="stitch" aria-hidden="true">
          <svg viewBox="0 0 160 160" fill="none">
            <path d="M0 40 C 60 40, 100 80, 160 80" stroke="#E7E3C9" stroke-width="26" stroke-linecap="round"/>
            <g stroke="#C9A227" stroke-width="2.5" stroke-linecap="round">
              <path d="M20 28 l10 10 M30 24 l10 10 M42 22 l10 10 M55 22 l10 10 M68 24 l10 10 M80 28 l10 10 M92 34 l10 10 M104 42 l10 10 M116 52 l10 10 M128 62 l10 10 M140 72 l10 8"/>
            </g>
          </svg>
        </div>
        <p class="sidebar__tagline">BASEBALL MAKES<br />US STRONGER</p>
        <div class="sidebar__brand">
          <span class="sidebar__brand-logo">BROS</span>
          <span class="sidebar__brand-sub">ONE TEAM, HIGHER TOGETHER</span>
        </div>
      </div>
    </aside>

    <div class="main">
      <!-- 홈은 상단바 없이 버튼들만 화면 모서리에 떠 있게 고정 (topbar--floating) -->
      <header class="topbar topbar--floating" id="topbar">
        <div class="topbar__left">
          <button class="icon-btn topbar__menu" id="menuToggle" aria-label="메뉴 열기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div class="logo logo--mobile">
            <span class="logo__text">Bros</span>
          </div>
        </div>
        <div class="topbar__right">
          <button class="icon-btn icon-btn--ghost" id="themeToggle" type="button" aria-label="다크모드 전환"></button>
          <button class="login-btn" id="loginBtn" type="button">로그인</button>
        </div>
      </header>

      <!-- 첫 화면: 고정된 배경 위에 문구만. 문구는 모두 한 글자씩 써지는 애니메이션 (js/main.js initHeroWriting)
           스크롤하면 이 배경은 그대로 있고, 아래 장면(팀 사진 → 리포트 → 기능 → 3단계)이 하나씩 올라옴 -->
      <section class="home-hero" id="homeHero">
        <div class="home-hero__backdrop" aria-hidden="true"></div>
        <!-- 스크롤할수록 진해져서 위로 올라온 장면이 잘 보이게 함 -->
        <div class="home-hero__dim" aria-hidden="true"></div>
        <div class="home-hero__inner">
          <div class="home-hero__text">
            <!-- data-write-step: 한 글자 쓰는 간격(초). 큰 제목은 천천히, 작은 글씨는 빠르게 -->
            <p class="home-hero__eyebrow" data-write data-write-step="0.03">
              <span class="home-hero__eyebrow-line" aria-hidden="true"></span>
              BROTHERS UNITED · GWANGJU
              <span class="home-hero__eyebrow-line home-hero__eyebrow-line--end" aria-hidden="true"></span>
            </p>
            <h1 class="home-hero__title" data-write data-write-step="0.18">함께라서,<br />더 멀리</h1>
            <p class="home-hero__desc" data-write data-write-step="0.035">혼자가 아닌, 우리가 만드는 이야기.<br />AI 자세 분석으로 한 걸음 더 성장하세요.</p>
          </div>
        </div>
        <a href="#homeTeam" class="home-hero__scroll" aria-label="아래로 스크롤">
          <span>SCROLL</span>
          <span class="home-hero__scroll-line" aria-hidden="true"></span>
        </a>
      </section>

      <!-- 장면 1: 팀 전체 사진(1280x960 가로 사진)이 아래에서 올라와 가로로 화면을 꽉 채움 (콘텐츠 여백 밖, 좌우 끝까지) -->
      <section class="home-scene home-scene--team" id="homeTeam">
        <figure class="home-team-photo" data-reveal>
          <img src="./assets/images/hero-team.jpg" width="1280" height="960" loading="lazy" alt="BROS 야구단 선수들이 CHAMPIONS 현수막을 들고 찍은 단체 사진" />
        </figure>
      </section>

      <main class="content home-content">
        <!-- 장면 2: 오늘의 AI 리포트 -->
        <section class="home-scene">
          <section class="hero" id="homeReport" data-reveal>
            <div class="hero__text">
              <p class="hero__eyebrow">AI가 만들어주는 더 나은 야구</p>
              <h2 class="hero__title">오늘의 AI 리포트</h2>
              <p class="hero__desc">당신의 영상을 분석해, 더 나은 선수를 위한 인사이트를 제공합니다.</p>
            </div>
          </section>

          <!-- 투수/타자 탭 + 분석 유형 / 분석 상태 / 최근 분석 / 측정 지표 + AI 코멘트 + 버튼 -->
          <div class="report-tabs" id="reportTabs" data-reveal data-reveal-offset="40">
            <button type="button" class="report-tab report-tab--active" data-type="pitching">투수</button>
            <button type="button" class="report-tab" data-type="batting">타자</button>
          </div>
          <section id="reportOverviewSlot" data-reveal data-reveal-offset="80"></section>
        </section>

        <!-- 장면 3: 기능 메뉴 4개(카드가 하나씩 순서대로 올라옴) + 3단계 안내를 한 화면에 -->
        <section class="home-scene home-scene--last">
          <section class="feature-grid" id="featureGrid"></section>

          <section class="how-bar" id="howBar" data-reveal>
            <div class="how-bar__brand">
              <span class="how-bar__logo">BROS</span>
              <p class="how-bar__title">3단계로 만나는 AI 야구 분석</p>
            </div>
          </section>
        </section>

      </main>
    </div>
  </div>

  <!-- 오른쪽 하단 플로팅 버튼: 클릭하면 "동영상 업로드" / "바로 촬영" 두 메뉴가 위로 펼쳐짐 -->
  <div class="fab-wrap" id="fabWrap">
    <button class="fab" id="fabToggle" type="button" aria-haspopup="true" aria-expanded="false" aria-label="영상 추가">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3z"/></svg>
    </button>
    <div class="fab-menu" id="fabMenu">
      <button class="fab-menu__item" id="fabUpload" type="button">
        <span class="fab-menu__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></span>
        <span>동영상 업로드</span>
      </button>
      <button class="fab-menu__item" id="fabRecord" type="button">
        <span class="fab-menu__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg></span>
        <span>바로 촬영</span>
      </button>
    </div>
  </div>

  <!-- 분석 종류 선택 모달 (업로드/촬영 공용) -->
  <div class="modal-overlay" id="typeModalOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="typeModalTitle">
      <div class="modal__head">
        <h3 class="modal__title" id="typeModalTitle">분석 종류를 선택하세요</h3>
        <button class="modal__close" id="typeModalClose" type="button" aria-label="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="modal__options" id="typeModalOptions"></div>
    </div>
  </div>

  <!-- 갤러리에서 영상을 선택하기 위한 숨김 파일 입력 -->
  <input type="file" id="videoFileInput" accept="video/mp4,video/quicktime,video/webm,video/*" hidden />

  <!-- 카메라 촬영 모달 -->
  <div class="modal-overlay" id="cameraModalOverlay" hidden>
    <div class="modal modal--camera" role="dialog" aria-modal="true" aria-labelledby="cameraModalTitle">
      <div class="modal__head">
        <h3 class="modal__title" id="cameraModalTitle">영상 촬영</h3>
        <button class="modal__close" id="cameraModalClose" type="button" aria-label="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="camera">
        <video class="camera__preview" id="cameraPreview" autoplay playsinline muted></video>
        <video class="camera__preview" id="cameraPlayback" playsinline hidden controls></video>
        <p class="camera__status" id="cameraStatus"></p>
        <div class="camera__controls" id="cameraControlsIdle">
          <button class="btn btn--ghost" id="cameraCancelBtn" type="button">촬영 취소</button>
          <button class="btn btn--primary" id="cameraStartBtn" type="button">촬영 시작</button>
        </div>
        <div class="camera__controls" id="cameraControlsRecording" hidden>
          <button class="btn btn--primary" id="cameraStopBtn" type="button">촬영 중지</button>
        </div>
        <div class="camera__controls" id="cameraControlsPreview" hidden>
          <button class="btn btn--ghost" id="cameraRetakeBtn" type="button">다시 촬영</button>
          <button class="btn btn--primary" id="cameraUseBtn" type="button">이 영상 사용</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 업로드/촬영 검증 실패 등 짧은 안내 메시지 -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./js/types.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/render.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/analysis.js"></script>
  <script src="./js/capture.js"></script>
  <script src="./js/shell.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
